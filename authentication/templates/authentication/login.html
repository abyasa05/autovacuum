{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vacuumanager</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'connections/css/styles.css' %}">
</head>

<body class="login-body">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="header-icon" style="margin: 0 auto 16px;">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <ellipse cx="12" cy="5" rx="9" ry="3" />
                        <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3" />
                        <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5" />
                    </svg>
                </div>
                <h2>Vacuumanager</h2>
                <p>PostgreSQL Database Cleaner</p>
            </div>

            {% if form.errors %}
            <div class="alert alert-error show" style="margin-bottom: 20px; justify-content: center;">
                Your username and password didn't match. Please try again.
            </div>
            {% endif %}

            <form method="post" action="{% url 'login' %}">
                {% csrf_token %}
                <div class="form-group">
                    <label class="form-label" for="id_username">Username</label>
                    <input class="form-input" type="text" name="username" id="id_username" required autofocus>
                </div>
                <div class="form-group">
                    <label class="form-label" for="id_password">Password</label>
                    <input class="form-input" type="password" name="password" id="id_password" required>
                </div>
                <button type="submit" class="btn btn-primary"
                    style="width: 100%; justify-content: center; margin-top: 24px; padding: 12px;">Log In</button>
                <input type="hidden" name="next" value="{{ next }}">
            </form>
        </div>
    </div>
</body>

</html>
